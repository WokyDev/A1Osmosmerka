name: Build A1 Osmosmerka APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project from current flattened repo
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/example/a1bot
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv BotAccessibilityService.kt app/src/main/java/com/example/a1bot/BotAccessibilityService.kt
          mv CaptureService.kt app/src/main/java/com/example/a1bot/CaptureService.kt
          mv MainActivity.kt app/src/main/java/com/example/a1bot/MainActivity.kt

          mv accessibility_service_config.xml app/src/main/res/xml/accessibility_service_config.xml
          mv strings.xml app/src/main/res/values/strings.xml
          mv styles.xml app/src/main/res/values/styles.xml

          mv tile_green.png app/src/main/res/drawable/tile_green.png
          mv tile_orange.png app/src/main/res/drawable/tile_orange.png
          mv tile_phone.png app/src/main/res/drawable/tile_phone.png
          mv tile_tower.png app/src/main/res/drawable/tile_tower.png
          mv tile_wifi.png app/src/main/res/drawable/tile_wifi.png

          # The flattened build.gradle.kts in the repo is the app-module file.
          mv build.gradle.kts app/build.gradle.kts

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          rm -f A1OSMOSMERKA

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A1OsmosmerkaBot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
