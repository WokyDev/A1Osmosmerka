name: Build A1 Osmosmerka APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/example/a1bot
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp BotAccessibilityService.kt app/src/main/java/com/example/a1bot/BotAccessibilityService.kt
          cp CaptureService.kt app/src/main/java/com/example/a1bot/CaptureService.kt
          cp MainActivity.kt app/src/main/java/com/example/a1bot/MainActivity.kt

          cp accessibility_service_config.xml app/src/main/res/xml/accessibility_service_config.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml

          cp tile_green.png app/src/main/res/drawable/tile_green.png
          cp tile_orange.png app/src/main/res/drawable/tile_orange.png
          cp tile_phone.png app/src/main/res/drawable/tile_phone.png
          cp tile_tower.png app/src/main/res/drawable/tile_tower.png
          cp tile_wifi.png app/src/main/res/drawable/tile_wifi.png

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.a1bot"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.a1bot"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A1OsmosmerkaBot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
